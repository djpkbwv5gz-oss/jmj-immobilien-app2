<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JMJ Immobilien"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>JMJ Immobilien</title>
<style>
:root{--g:#d4af62}*{box-sizing:border-box}body{margin:0;background:#080808;color:white;font-family:-apple-system,sans-serif}main{max-width:650px;margin:auto;padding:24px 18px}header{text-align:center;padding:25px;border-bottom:1px solid #594824}.logo{font-size:48px;font-weight:800;color:var(--g);letter-spacing:4px}.brand{letter-spacing:5px;font-weight:bold}.tag{color:var(--g);font-size:10px;letter-spacing:2px;margin-top:8px}.panel{background:#171717;border:1px solid #45371e;border-radius:18px;padding:18px;margin-top:18px}h2{font-size:15px;color:var(--g)}button{width:100%;padding:15px;border:0;border-radius:12px;background:var(--g);font-weight:bold;margin:12px 0}small,p{color:#aaa;line-height:1.5}
</style>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
window.OneSignalDeferred=window.OneSignalDeferred||[];
OneSignalDeferred.push(async function(OneSignal){
 await OneSignal.init({appId:"HIER_ONESIGNAL_APP_ID_EINTRAGEN",serviceWorkerPath:"OneSignalSDKWorker.js",serviceWorkerParam:{scope:"/"}});
});
</script></head><body><main><header><div class="logo">JMJ</div><div class="brand">IMMOBILIEN</div><div class="tag">VIRTUELLE VERKAUFSSIMULATION</div></header>
<section class="panel"><h2>HINTERGRUND-BENACHRICHTIGUNGEN</h2><p>Aktiviere Push-Mitteilungen, damit JMJ auch bei geschlossener App virtuelle Verkäufe melden kann.</p><button id="enable">PUSH-BENACHRICHTIGUNGEN AKTIVIEREN</button><p id="status">Noch nicht aktiviert.</p><small>Geplant: alle 15 Minuten. Alle Preise sind erfunden und dienen nur der Simulation.</small></section></main>
<script>
document.getElementById("enable").addEventListener("click",()=>{
 OneSignalDeferred.push(async OneSignal=>{await OneSignal.Notifications.requestPermission();document.getElementById("status").textContent="Bitte prüfe die Mitteilungsfreigabe in iPadOS.";});
});
</script></body></html>
