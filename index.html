<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JMJ Immobilien">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>JMJ Immobilien</title>
<style>
:root { --g:#d4af62; }
* { box-sizing:border-box; }
body {
 margin:0;
 background:#080808;
 color:white;
 font-family:-apple-system,sans-serif;
}
main {
 max-width:650px;
 margin:auto;
 padding:24px 18px;
}
header {
 text-align:center;
 padding:25px;
 border-bottom:1px solid #594824;
}
.logo {
 font-size:48px;
 font-weight:800;
 color:var(--g);
 letter-spacing:4px;
}
.brand {
 letter-spacing:5px;
 font-weight:bold;
}
.tag {
 color:var(--g);
 font-size:10px;
 letter-spacing:2px;
 margin-top:8px;
}
.panel {
 background:#171717;
 border:1px solid #45371e;
 border-radius:18px;
 padding:18px;
 margin-top:18px;
}
h2 {
 font-size:15px;
 color:var(--g);
}
button {
 width:100%;
 padding:15px;
 border:0;
 border-radius:12px;
 background:var(--g);
 font-weight:bold;
 margin:12px 0;
 cursor:pointer;
}
button:disabled {
 opacity:.6;
}
small,p {
 color:#aaa;
 line-height:1.5;
}
</style>
<script
 src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
 defer>
</script>
<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function(OneSignal) {
 const status = document.getElementById("status");
 try {
  await OneSignal.init({
   appId:"db856c4e-65ff-482e-a05a-b7e6a1596b00",
   serviceWorkerPath:"/jmj-immobilien-app2/OneSignalSDKWorker.js",
   serviceWorkerParam:{
    scope:"/jmj-immobilien-app2/"
   }
  });
  window.JMJOneSignal = OneSignal;
  if(status) {
   status.textContent = "OneSignal ist bereit.";
  }
 } catch(error) {
  console.error("OneSignal Fehler:",error);
  if(status) {
   status.textContent = "Fehler beim Laden: " + error.message;
  }
 }
});
</script>
</head>
<body>
<main>
<header>
 <div class="logo">JMJ</div>
 <div class="brand">IMMOBILIEN</div>
 <div class="tag">VIRTUELLE VERKAUFSSIMULATION</div>
</header>
<section class="panel">
 <h2>HINTERGRUND-BENACHRICHTIGUNGEN</h2>
 <p>
 Aktiviere Push-Mitteilungen, damit JMJ auch bei geschlossener App
 virtuelle Verkäufe melden kann.
 </p>
 <button id="enable">
 PUSH-BENACHRICHTIGUNGEN AKTIVIEREN
 </button>
 <p id="status">OneSignal wird geladen ...</p>
 <small>
 Geplant: alle 15 Minuten. Alle Preise sind erfunden
 und dienen nur der Simulation.
 </small>
</section>
</main>
<script>
document.getElementById("enable").addEventListener("click", async function() {
 const status = document.getElementById("status");
 const button = this;
 try {
  button.disabled = true;
  status.textContent = "Benachrichtigungen werden aktiviert ...";
  if(!window.JMJOneSignal) {
   throw new Error("OneSignal ist noch nicht bereit. Bitte lade die App neu.");
  }
  await window.JMJOneSignal.Notifications.requestPermission();
  status.textContent =
   "Bitte prüfe die Mitteilungsfreigabe in iPadOS.";
 } catch(error) {
  status.textContent = "Fehler: " + error.message;
  console.error(error);
 } finally {
  button.disabled = false;
 }
});
</script>
</body>
</html>
